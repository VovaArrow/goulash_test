[project]
name = "goulash-suppliers"
version = "0.1.0"
description = "Goulash · Поставщики — поиск и сравнение поставщиков продуктов питания"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
